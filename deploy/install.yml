name: install

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 与主 CI 共用同一套独立版本规则（tools/release_meta.py）
      - id: set_tag
        run: python3 tools/release_meta.py
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  install:
    needs: meta
    runs-on: macos-latest
    strategy:
      matrix:
        os: [win, macos, linux, android]
        arch: [aarch64, x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os }}-${{ matrix.arch }}*"
          latest: true
          out-file-path: "deps"
          extract: true

      - name: Download mfw-licence release
        if: matrix.os != 'android'
        id: download_release
        uses: robinraju/release-downloader@v1
        with:
          repository: hoey94/mfw-licence
          fileName: "mfw-licence-${{ matrix.os }}-${{ matrix.arch }}*"
          latest: true
          out-file-path: "MFW"
          extract: true

      - name: Clean up downloaded archive
        if: matrix.os != 'android'
        shell: bash
        run: |
          ARCHIVE_FILE_PATH="${{ fromJson(steps.download_release.outputs.downloaded_files)[0] }}"
          rm -f "${ARCHIVE_FILE_PATH}"
          echo "Archive cleanup command executed."

      - name: Install
        shell: bash
        run: |
          python ./install.py ${{ needs.meta.outputs.tag }}

          if [[ "${{ matrix.os }}" != "android" ]]; then
            if [ -d "MFW" ]; then
              echo "Copying MFW files to install directory..."
              mkdir -p install
              rsync -av --ignore-existing MFW/ install/
            else
              echo "MFW directory not found, skipping copy."
            fi
          else
            echo "Skipping copy MFW for Android."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mfw-licence-resource-${{ matrix.os }}-${{ matrix.arch }}
          path: "install"

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - run: |
          cd assets
          for f in *; do
            if [[ $f == *"macos"* ]]; then
              find $f -type f -name "maapicli" -exec chmod +x {} \; 2>/dev/null || true
              find $f -type f -name "MFW" -exec chmod +x {} \; 2>/dev/null || true
              tar -cpzf $f-${{ needs.meta.outputs.tag }}.tar.gz -C $f .
            else
              (cd $f && zip -r ../$f-${{ needs.meta.outputs.tag }}.zip .)
            fi
          done

      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.is_prerelease }}